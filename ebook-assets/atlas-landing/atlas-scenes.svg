<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="t d"><title id="t">Ba cảnh concept của Atlas Hành Tinh</title><desc id="d">Trái Đất màu xanh, Sao Hỏa màu đỏ và Sao Kim màu vàng, mỗi cảnh có thông điệp riêng.</desc><defs><radialGradient id="earth" cx="35%" cy="30%"><stop stop-color="#c3eff0"/><stop offset=".4" stop-color="#4b9abc"/><stop offset="1" stop-color="#0b2d56"/></radialGradient><radialGradient id="mars" cx="35%" cy="30%"><stop stop-color="#f5bc91"/><stop offset=".5" stop-color="#c66f52"/><stop offset="1" stop-color="#5b2a2b"/></radialGradient><radialGradient id="venus" cx="35%" cy="30%"><stop stop-color="#fff0b1"/><stop offset=".55" stop-color="#d5a46b"/><stop offset="1" stop-color="#6e4c4a"/></radialGradient></defs><rect width="1200" height="530" rx="25" fill="#eef2f2"/><text x="40" y="54" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#314e62">BA CẢNH · MỘT CẤU TRÚC NỘI DUNG</text><text x="40" y="82" font-family="Arial,sans-serif" font-size="13" fill="#647984">Mỗi cảnh cần ảnh/video, poster, tiêu đề, mô tả và đích nút đi cùng nhau.</text>
<g font-family="Arial,sans-serif"><rect x="39" y="111" width="352" height="367" rx="18" fill="#10233d"/><circle cx="215" cy="348" r="122" fill="url(#earth)"/><path d="M154 280c36-23 69-8 83 11 11 15-5 28-22 29-9 29-44 11-52 39-12 10-35-13-39-36-7-17 8-31 30-43Z" fill="#92bda7" opacity=".8"/><text x="62" y="151" font-size="13" fill="#92deec" font-weight="700">01 / NGÔI NHÀ</text><text x="62" y="187" font-family="Georgia,serif" font-size="31" fill="#fff">TRÁI ĐẤT</text><text x="62" y="213" font-size="13" fill="#d1e1e9">Khởi đầu hành trình khám phá</text><rect x="83" y="434" width="264" height="27" rx="13" fill="#e5f7fb"/><text x="215" y="452" text-anchor="middle" font-size="11" fill="#193b55" font-weight="700">XEM NỘI DUNG KHÓA HỌC</text>
<rect x="424" y="111" width="352" height="367" rx="18" fill="#30212c"/><circle cx="600" cy="348" r="122" fill="url(#mars)"/><path d="M527 313c30-19 45-15 62-7m49 33c25-12 43-7 61 4m-92 48c27-12 48-9 72 0" fill="none" stroke="#e5ab83" stroke-width="13" opacity=".38"/><text x="447" y="151" font-size="13" fill="#ffbc94" font-weight="700">02 / CÂU HỎI</text><text x="447" y="187" font-family="Georgia,serif" font-size="31" fill="#fff">SAO HỎA</text><text x="447" y="213" font-size="13" fill="#f1d8cc">Một thế giới đầy dấu vết để tìm</text><rect x="468" y="434" width="264" height="27" rx="13" fill="#ffebde"/><text x="600" y="452" text-anchor="middle" font-size="11" fill="#603a36" font-weight="700">XEM BÀI HỌC MẪU</text>
<rect x="809" y="111" width="352" height="367" rx="18" fill="#3a2d3a"/><circle cx="985" cy="348" r="122" fill="url(#venus)"/><path d="M888 350c54-26 115-17 185 4m-174 33c63-17 117-13 177 7m-171-83c54-17 111-17 168-5" fill="none" stroke="#fff0c3" stroke-width="10" opacity=".3"/><text x="832" y="151" font-size="13" fill="#f8d6a3" font-weight="700">03 / TƯƠNG PHẢN</text><text x="832" y="187" font-family="Georgia,serif" font-size="31" fill="#fff">SAO KIM</text><text x="832" y="213" font-size="13" fill="#f0e0cb">Ở gần, nhưng thật khác biệt</text><rect x="853" y="434" width="264" height="27" rx="13" fill="#fff0d9"/><text x="985" y="452" text-anchor="middle" font-size="11" fill="#6b4b40" font-weight="700">XEM LỊCH HỌC</text></g>
<text x="40" y="509" font-family="Arial,sans-serif" font-size="12" fill="#687b84">Ảnh concept tĩnh để duyệt hướng sản xuất. Trang thật cần asset đã xuất và các nút có đích hoạt động.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Từ mô hình Mira đến chuyển động trong game</title>
<desc id="desc">Năm bước: model Mira, Retopo, gắn xương, tạo clip và xuất GLB, phát clip trong game Three.js.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121b32"/><stop offset="1" stop-color="#17283d"/></linearGradient><linearGradient id="top" x2="1"><stop stop-color="#79d9d0"/><stop offset="1" stop-color="#aaa2f2"/></linearGradient></defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<path d="M25 25H1175" stroke="#6f879b" opacity=".3"/>
<text x="44" y="65" fill="#d9eeef" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">MIRA · TỪ MODEL TĨNH ĐẾN CHUYỂN ĐỘNG</text>
<text x="44" y="93" fill="#aabccb" font-family="Arial,sans-serif" font-size="14">Mỗi bước chỉ giải quyết một việc; duyệt kết quả trước khi sang bước kế tiếp.</text>
<g font-family="Arial,sans-serif">
<rect x="38" y="135" width="204" height="153" rx="17" fill="#22354b" stroke="#446477"/><rect x="38" y="135" width="204" height="5" rx="3" fill="#79d9d0"/><text x="56" y="169" fill="#79d9d0" font-size="15" font-weight="700">01 · MODEL</text><text x="56" y="209" fill="#fff" font-size="22" font-weight="700">Mira đã duyệt</text><text x="56" y="239" fill="#c6d4dd" font-size="15">Hình, màu, chất liệu</text><text x="56" y="261" fill="#c6d4dd" font-size="15">Chưa cử động khớp</text>
<rect x="268" y="135" width="204" height="153" rx="17" fill="#22354b" stroke="#446477"/><rect x="268" y="135" width="204" height="5" rx="3" fill="#8ad8c0"/><text x="286" y="169" fill="#8ad8c0" font-size="15" font-weight="700">02 · TRIPO RETOPO</text><text x="286" y="209" fill="#fff" font-size="22" font-weight="700">Làm lại lưới</text><text x="286" y="239" fill="#c6d4dd" font-size="15">So mặt, tóc, bốt</text><text x="286" y="261" fill="#c6d4dd" font-size="15">Giữ chi tiết quan trọng</text>
<rect x="498" y="135" width="204" height="153" rx="17" fill="#22354b" stroke="#446477"/><rect x="498" y="135" width="204" height="5" rx="3" fill="#9cbaf0"/><text x="516" y="169" fill="#9cbaf0" font-size="15" font-weight="700">03 · TRIPO RIG</text><text x="516" y="209" fill="#fff" font-size="22" font-weight="700">Gắn xương</text><text x="516" y="239" fill="#c6d4dd" font-size="15">Vai · Hông · Gối</text><text x="516" y="261" fill="#c6d4dd" font-size="15">Kiểm khớp và da</text>
<rect x="728" y="135" width="204" height="153" rx="17" fill="#22354b" stroke="#446477"/><rect x="728" y="135" width="204" height="5" rx="3" fill="#b6a9e9"/><text x="746" y="169" fill="#b6a9e9" font-size="15" font-weight="700">04 · TRIPO ANIMATE</text><text x="746" y="209" fill="#fff" font-size="22" font-weight="700">Tạo clip + GLB</text><text x="746" y="239" fill="#c6d4dd" font-size="15">Đứng · Đi · Chạy</text><text x="746" y="261" fill="#c6d4dd" font-size="15">Xuất và kiểm file</text>
<rect x="958" y="135" width="204" height="153" rx="17" fill="#22354b" stroke="#446477"/><rect x="958" y="135" width="204" height="5" rx="3" fill="#dec0a4"/><text x="976" y="169" fill="#dec0a4" font-size="15" font-weight="700">05 · GAME</text><text x="976" y="209" fill="#fff" font-size="22" font-weight="700">Three.js phát</text><text x="976" y="239" fill="#c6d4dd" font-size="15">Theo thao tác chơi</text><text x="976" y="261" fill="#c6d4dd" font-size="15">Kiểm bốt, gối, nhịp</text>
<g stroke="#84bdbc" stroke-width="2" fill="none"><path d="M245 211h17m-6-6 6 6-6 6"/><path d="M475 211h17m-6-6 6 6-6 6"/><path d="M705 211h17m-6-6 6 6-6 6"/><path d="M935 211h17m-6-6 6 6-6 6"/></g>
</g><path d="M38 315H1162" stroke="#6f879b" opacity=".35"/><text x="40" y="338" fill="#afc1cb" font-family="Arial,sans-serif" font-size="13">Ảnh và model đẹp là đầu vào. Chuyển động tự nhiên cần cả rig, clip và điều khiển trong game khớp nhau.</text>
</svg>
